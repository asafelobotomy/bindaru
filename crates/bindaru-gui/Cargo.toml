[package]
name = "bindaru-gui"
description = "bindaru's window: sidebar, search header, package view and inspector (Qt Quick, themed by uQ)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bindaru-gui"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
libc = "0.2"
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"
