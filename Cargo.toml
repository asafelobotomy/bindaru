[workspace]
resolver = "3"
members = ["crates/bindaru-core", "crates/bindaru-cli", "crates/bindaru-gui"]
# The window needs Qt 6; the default build and tests don't.
default-members = ["crates/bindaru-core", "crates/bindaru-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.0.1"
license = "GPL-3.0-or-later"
authors = ["asafelobotomy"]
repository = "https://github.com/asafelobotomy/bindaru"
description = "pacman and AUR package store for uQ"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
