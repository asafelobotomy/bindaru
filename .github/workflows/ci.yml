name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      # the vendored uq-theme (uQ's native/uq-theme) is exactly the pinned release
      - run: scripts/check-uq-theme.sh 1.0.0 crates/bindaru-gui/src/uq_theme.rs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  uq-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test 'tests/uq/*.test.mjs'
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-layouts \
            qml6-module-qtquick-controls qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml qml6-module-qtqml-models
      - run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq/tst_page.qml
  # The window needs Kirigami 6 and a recent Qt, so it builds on Arch, its target distribution.
  window:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the toolchain, Qt 6 and Kirigami
        run: |
          pacman -Syu --noconfirm --needed git rust clang base-devel qt6-base qt6-declarative \
            kirigami plasma-integration breeze-icons inter-font python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tests/gui/run.sh
      - run: cargo clippy -p bindaru-gui -- -D warnings
      - name: The window starts and loads every QML file
        run: |
          cargo build -p bindaru-gui
          QT_QPA_PLATFORM=offscreen timeout 5 ./target/debug/bindaru-gui 2>&1 | tee /tmp/gui.log || true
          ! grep -E "ReferenceError|TypeError|unavailable|Unable to assign|is not installed" /tmp/gui.log
