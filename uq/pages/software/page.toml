# bindaru's page in uQ Settings (under Apps): browse, install and remove software, with the AUR
# review shown here before anything from the AUR is built. Installed to
# /usr/share/uq/settings/pages/software/ by bindaru's package; inert without uQ.
# Everything goes through the `bindaru` command line; reference: docs/settings-pages.md in uQ.
uq_api = 3
id = "software"
name = "Software"
icon = "bindaru"
category = "apps"
qml = "Page.qml"
keywords = ["software", "packages", "pacman", "aur", "install", "uninstall", "store", "bindaru"]

[[setting]]
id = "browse"
label = "Find and install software"
keywords = ["search", "package", "pacman", "aur", "get"]

[[setting]]
id = "installed"
label = "Installed software"
keywords = ["remove", "uninstall", "list", "packages"]

[[setting]]
id = "aur"
label = "Use the AUR"
keywords = ["arch user repository", "community", "pkgbuild"]

[[setting]]
id = "repositories"
label = "Repositories"
keywords = ["repo", "repository", "multilib", "testing", "mirror", "add repository", "pacman.conf", "signing key"]

[[setting]]
id = "scan-installs"
label = "Scan new installs with oysterAV"
keywords = ["antivirus", "virus", "malware", "scan", "oysterav", "security"]

[[setting]]
id = "layout"
label = "Software view"
keywords = ["list", "grid", "compact", "sort", "group", "density", "inspector", "dependencies", "search"]

[[setting]]
id = "aur-risky"
label = "Show orphaned or outdated AUR packages"
keywords = ["orphan", "out of date", "flagged"]

[requires]
bins = ["bindaru"]

# ---- reads
[[command]]
id = "installed"
argv = ["/usr/bin/bindaru", "installed", "--json"]
output = "json"
timeout_ms = 20000
# pacman holds this lock for the length of every transaction, so the list refreshes after each.
watch = { files = ["/var/lib/pacman/db.lck"] }

[[command]]
id = "config"
argv = ["/usr/bin/bindaru", "config", "show", "--json"]
output = "json"
timeout_ms = 10000
watch = { files = ["~/.config/bindaru/config.toml"] }

[[command]]
id = "search"
argv = ["/usr/bin/bindaru", "search", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "query", pattern = "^[A-Za-z0-9][A-Za-z0-9._+@ -]{1,63}$" }]

# Downloads the recipe (PKGBUILD and install scripts) of an AUR package and prints the review:
# findings, and the hash `install-aur` needs. Builds and installs nothing.
[[command]]
id = "review-aur"
argv = ["/usr/bin/bindaru", "review", "--json", "--aur"]
output = "json"
timeout_ms = 120000
args = [{ name = "package", pattern = "^[a-z0-9@._+][a-z0-9@._+-]{0,254}$" }]

# ---- what an action would change: reads, with the same arguments as the action.
[[command]]
id = "preview-install"
argv = ["/usr/bin/bindaru", "install", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "package", pattern = "^[a-z0-9@._+][a-z0-9@._+-]{0,254}$" }]

[[command]]
id = "preview-remove"
argv = ["/usr/bin/bindaru", "remove", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "package", pattern = "^[a-z0-9@._+][a-z0-9@._+-]{0,254}$" }]

# ---- actions. Streamed: a line per step and per line of pacman's output. Root comes from
# bindaru's own helper (polkit asks for the password); the page never runs anything as root.
[[command]]
id = "install"
argv = ["/usr/bin/bindaru", "install", "--ndjson"]
output = "ndjson"
timeout_ms = 600000
args = [{ name = "package", pattern = "^[a-z0-9@._+][a-z0-9@._+-]{0,254}$" }]
confirm = "Install %s?"
preview = "preview-install"

# The review card is the confirmation: this runs only after the person said they read the
# recipe the hash names; `bindaru` refuses if the recipe changed since.
[[command]]
id = "install-aur"
argv = ["/usr/bin/bindaru", "install", "--aur", "--ndjson", "--ack"]
output = "ndjson"
timeout_ms = 600000
args = [{ name = "hash", pattern = "^[0-9a-f]{64}$" }, { name = "package", pattern = "^[a-z0-9@._+][a-z0-9@._+-]{0,254}$" }]

[[command]]
id = "remove"
argv = ["/usr/bin/bindaru", "remove", "--ndjson"]
output = "ndjson"
timeout_ms = 600000
args = [{ name = "package", pattern = "^[a-z0-9@._+][a-z0-9@._+-]{0,254}$" }]
confirm = "Remove %s and what only it needed?"
preview = "preview-remove"

# ---- settings: `bindaru config` checks each value before it writes.
[[command]]
id = "config-set"
argv = ["/usr/bin/bindaru", "config", "set", "--json"]
output = "json"
timeout_ms = 10000
args = [{ name = "key", pattern = "^(aur_enabled|aur_update_diff|aur_show_risky|view|sort|sort_descending|group_by|density|show_inspector|search_in|start_filter|confirm_removals|show_dependencies|scan_installs)$" }, { name = "value", pattern = "^[a-z-]{1,20}$" }]

# ---- repositories: read the list; every change is previewed, then runs through bindaru's helper
# (polkit asks for the password). Added repositories are HTTPS only and need signed packages.
[[command]]
id = "repos"
argv = ["/usr/bin/bindaru", "repos", "list", "--json"]
output = "json"
timeout_ms = 10000
watch = { files = ["/etc/pacman.conf", "/etc/pacman.d/bindaru-repos.conf"] }

[[command]]
id = "preview-repo-add"
argv = ["/usr/bin/bindaru", "repos", "add", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }, { name = "server", pattern = "^https://[A-Za-z0-9._~:/@%+$-]{1,300}$" }]

[[command]]
id = "repo-add"
argv = ["/usr/bin/bindaru", "repos", "add", "--ndjson"]
output = "ndjson"
timeout_ms = 300000
args = [{ name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }, { name = "server", pattern = "^https://[A-Za-z0-9._~:/@%+$-]{1,300}$" }]
confirm = "Add the repository %s?"
preview = "preview-repo-add"

# The same, trusting the repository's signing key (its 40-digit fingerprint) first.
[[command]]
id = "preview-repo-add-key"
argv = ["/usr/bin/bindaru", "repos", "add", "--dry-run", "--json", "--key"]
output = "json"
timeout_ms = 20000
args = [{ name = "fingerprint", pattern = "^[0-9A-Fa-f]{40}$" }, { name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }, { name = "server", pattern = "^https://[A-Za-z0-9._~:/@%+$-]{1,300}$" }]

[[command]]
id = "repo-add-key"
argv = ["/usr/bin/bindaru", "repos", "add", "--ndjson", "--key"]
output = "ndjson"
timeout_ms = 300000
args = [{ name = "fingerprint", pattern = "^[0-9A-Fa-f]{40}$" }, { name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }, { name = "server", pattern = "^https://[A-Za-z0-9._~:/@%+$-]{1,300}$" }]
confirm = "Add a repository signed by key %s?"
preview = "preview-repo-add-key"

[[command]]
id = "preview-repo-remove"
argv = ["/usr/bin/bindaru", "repos", "remove", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }]

[[command]]
id = "repo-remove"
argv = ["/usr/bin/bindaru", "repos", "remove", "--ndjson"]
output = "ndjson"
timeout_ms = 300000
args = [{ name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }]
confirm = "Remove the repository %s?"
preview = "preview-repo-remove"

[[command]]
id = "preview-repo-official"
argv = ["/usr/bin/bindaru", "repos", "official", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }, { name = "state", pattern = "^(on|off)$" }]

[[command]]
id = "repo-official"
argv = ["/usr/bin/bindaru", "repos", "official", "--ndjson"]
output = "ndjson"
timeout_ms = 300000
args = [{ name = "name", pattern = "^[a-z0-9][a-z0-9_-]{0,31}$" }, { name = "state", pattern = "^(on|off)$" }]
confirm = "Switch %s?"
preview = "preview-repo-official"

# ---- oysterAV: hand installed software to the scanner.
[[command]]
id = "preview-scan-aur"
argv = ["/usr/bin/bindaru", "scan", "--dry-run", "--json", "--aur"]
output = "json"
timeout_ms = 60000

[[command]]
id = "scan-aur"
argv = ["/usr/bin/bindaru", "scan", "--ndjson", "--aur"]
output = "ndjson"
timeout_ms = 600000
confirm = "Scan the AUR and other outside packages with oysterAV?"
preview = "preview-scan-aur"

[[command]]
id = "preview-scan-all"
argv = ["/usr/bin/bindaru", "scan", "--dry-run", "--json", "--all"]
output = "json"
timeout_ms = 60000

[[command]]
id = "scan-all"
argv = ["/usr/bin/bindaru", "scan", "--ndjson", "--all"]
output = "ndjson"
timeout_ms = 600000
confirm = "Scan everything installed with oysterAV? This can take a while."
preview = "preview-scan-all"
